<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .contents{
            width: 600px;
            position: relative;
            margin: auto;
        }
        img{
            width: 100%;

        }

        .wakeup{
            position: absolute;
            top: 0px;
            left: 0px;
            transform:translate(300%,30%);
        }
        .school{
            position: absolute;
            right: 250px;
            bottom: 40px;
            transform: translate(-90%,-320%);
        }
        

    </style>


</head>
<body>
    <div class="contents">
        <img src="wakeup.png" alt="">
        <div class="wakeup"><h3>일어나.</h3></div>
        
        <h3 class="school">학교가야지</h3>

    </div>



</body>
</html>
